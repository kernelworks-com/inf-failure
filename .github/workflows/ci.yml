name: CPU checks and source delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++-13
            mode: Release
            flags: -Wall -Wextra -Wpedantic -Werror
          - os: ubuntu-24.04
            compiler: clang++-18
            mode: Debug
            flags: -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
          - os: macos-14
            compiler: clang++
            mode: Release
            flags: -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record tools
        run: |
          cmake --version
          "${{ matrix.compiler }}" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
  source-delivery:
    name: Test and deliver source archive
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive committed source
        run: |
          mkdir -p dist unpacked
          git archive --format=tar --prefix=source/ HEAD | gzip -n > dist/source.tar.gz
          tar -xzf dist/source.tar.gz -C unpacked
          cd dist
          sha256sum source.tar.gz > SHA256SUMS
      - name: Test extracted source
        run: |
          cmake -S unpacked/source -B package-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build package-build --parallel 2
          ctest --test-dir package-build --output-on-failure --no-tests=error
      - name: Upload tested source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
